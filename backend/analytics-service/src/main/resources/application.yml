server:
  port: 8086

spring:

  application:
    name: ANALYTICS-SERVICE

  datasource:
    url: jdbc:postgresql://localhost:5433/analyticsdb
    username: postgres
    password: postgres123

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"