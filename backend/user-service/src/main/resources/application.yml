server:
  port: 8082

spring:

  application:
    name: USER-SERVICE

  datasource:
    url: jdbc:postgresql://localhost:5433/userdb?options=-c%20TimeZone=UTC
    username: postgres
    password: postgres123
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC';

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC

  servlet:

    multipart:

      max-file-size: 10MB

      max-request-size: 10MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"